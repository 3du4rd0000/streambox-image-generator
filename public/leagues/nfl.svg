<svg width="800" height="300" viewBox="20 20 760 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo verde del campo -->
  <rect x="36" y="32" width="728" height="236" rx="32" ry="32" fill="#0a7d22"/>

  <!-- Campo NFL -->
  <g stroke="black" stroke-width="3" fill="none" stroke-linecap="round">

    <!-- Perímetro -->
    <rect x="80" y="45" width="640" height="210"/>

    <!-- END ZONES -->
    <rect x="80"  y="45" width="64"  height="210" fill="#0052A5"/>
    <rect x="656" y="45" width="64"  height="210" fill="#E41E26"/>

    <!-- Líneas de yarda cada 10 -->
    <line x1="144" y1="45" x2="144" y2="255"/>
    <line x1="208" y1="45" x2="208" y2="255"/>
    <line x1="272" y1="45" x2="272" y2="255"/>
    <line x1="336" y1="45" x2="336" y2="255"/>
    <line x1="400" y1="45" x2="400" y2="255"/>
    <line x1="464" y1="45" x2="464" y2="255"/>
    <line x1="528" y1="45" x2="528" y2="255"/>
    <line x1="592" y1="45" x2="592" y2="255"/>
    <line x1="656" y1="45" x2="656" y2="255"/>

    <!-- Hash marks centro -->
    <g stroke-width="2">
      <line x1="400" y1="90" x2="400" y2="100"/>
      <line x1="400" y1="200" x2="400" y2="210"/>
    </g>

  </g>

  <!-- TEXTO VERTICAL EN END ZONES -->

  <!-- Izquierda STREAMBOX -->
  <text x="112" y="150"
        fill="black"
        font-size="20"
        font-weight="bold"
        font-family="Arial, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle"
        transform="rotate(-90 112 150)">
    STREAMBOX
  </text>

  <!-- Derecha STREAMBOX -->
  <text x="688" y="150"
        fill="black"
        font-size="20"
        font-weight="bold"
        font-family="Arial, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle"
        transform="rotate(90 688 150)">
    STREAMBOX
  </text>

  <!-- POSTES -->
  <g stroke="black" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="65"  y1="130" x2="65"  y2="170"/>
    <line x1="60"  y1="150" x2="70"  y2="150"/>

    <line x1="735" y1="130" x2="735" y2="170"/>
    <line x1="730" y1="150" x2="740" y2="150"/>
  </g>

  <!-- NÚMEROS DE YARDAS ROTADOS 90° -->
  <g fill="black"
     font-size="14"
     font-weight="bold"
     font-family="Arial, sans-serif"
     text-anchor="middle"
     dominant-baseline="middle">

    <!-- Arriba -->
    <text x="213" y="60"  transform="rotate(90 213 60)">20</text>
    <text x="277" y="60"  transform="rotate(90 277 60)">30</text>
    <text x="341" y="60"  transform="rotate(90 341 60)">40</text>
    <text x="405" y="60"  transform="rotate(90 405 60)">50</text>
    <text x="469" y="60"  transform="rotate(90 469 60)">40</text>
    <text x="533" y="60"  transform="rotate(90 533 60)">30</text>
    <text x="597" y="60"  transform="rotate(90 597 60)">20</text>

    <!-- Abajo -->
    <text x="213" y="240" transform="rotate(90 213 240)">20</text>
    <text x="277" y="240" transform="rotate(90 277 240)">30</text>
    <text x="341" y="240" transform="rotate(90 341 240)">40</text>
    <text x="405" y="240" transform="rotate(90 405 240)">50</text>
    <text x="469" y="240" transform="rotate(90 469 240)">40</text>
    <text x="533" y="240" transform="rotate(90 533 240)">30</text>
    <text x="597" y="240" transform="rotate(90 597 240)">20</text>
  </g>

  <!-- CÍRCULO NEGRO Y LETRAS T / V EN CADA MEDIA LUNA -->
  <circle cx="400" cy="150" r="40" fill="none" stroke="black" stroke-width="3"/>

  <text x="380" y="150"
        fill="black"
        font-size="32"
        font-weight="bold"
        font-family="Arial, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle">
    T
  </text>

  <text x="420" y="150"
        fill="black"
        font-size="32"
        font-weight="bold"
        font-family="Arial, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle">
    V
  </text>

</svg>
