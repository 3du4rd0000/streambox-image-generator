<svg width="800" height="300" viewBox="50 50 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSplitH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052A5"/>
      <stop offset="50%" stop-color="#0052A5"/>
      <stop offset="50%" stop-color="#E41E26"/>
      <stop offset="100%" stop-color="#E41E26"/>
    </linearGradient>
  </defs>

  <!-- Fondo mitad azul / mitad rojo -->
  <rect x="36" y="32" width="728" height="236" rx="32" ry="32" fill="url(#bgSplitH)"/>

  <!-- Líneas de cancha minimalista -->
  <g stroke="black" stroke-width="4" fill="none" stroke-linecap="round">

    <!-- Perímetro de la cancha -->
    <rect x="80" y="45" width="640" height="210"/>

    <!-- Línea de media cancha -->
    <line x1="400" y1="45" x2="400" y2="255"/>

    <!-- Triple IZQUIERDA -->
    <line x1="80" y1="90" x2="150" y2="90"/>
    <line x1="80" y1="220" x2="150" y2="220"/>
    <path d="M150 90 A120 120 0 0 1 150 220"/>

    <!-- Triple DERECHA -->
    <line x1="720" y1="90" x2="650" y2="90"/>
    <line x1="720" y1="220" x2="650" y2="220"/>
    <path d="M650 90 A120 120 0 0 0 650 220"/>

    <!-- PINTURA MINIMALISTA REDUCIDA AL 65% -->

    <!-- Izquierda -->
    <rect x="80" y="125" width="52" height="58.5"/>
    <path d="M132 125 A29.25 29.25 0 0 1 132 183.5"/>

    <!-- Derecha -->
    <rect x="668" y="125" width="52" height="58.5"/>
    <path d="M668 125 A29.25 29.25 0 0 0 668 183.5"/>

  </g>

  <!-- Estructuras de canasta (tablero + aro + soporte) -->
  <g stroke="black" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Canasta izquierda -->
    <!-- Tablero (línea vertical) -->
    <line x1="88" y1="135" x2="88" y2="165"/>
    <!-- Aro -->
    <circle cx="102" cy="150" r="7"/>
    <!-- Soporte simple del aro hacia adentro de la cancha -->
    <line x1="88" y1="150" x2="95" y2="150"/>

    <!-- Canasta derecha -->
    <!-- Tablero -->
    <line x1="712" y1="135" x2="712" y2="165"/>
    <!-- Aro -->
    <circle cx="698" cy="150" r="7"/>
    <!-- Soporte -->
    <line x1="712" y1="150" x2="705" y2="150"/>
  </g>

  <!-- Círculo alrededor del texto TV -->
  <circle cx="400" cy="150" r="75" stroke="black" stroke-width="4" fill="none"/>
  
  <!-- Texto TV en el centro -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="black">
    <tspan>T</tspan><tspan dx="15">V</tspan>
  </text>
</svg>
